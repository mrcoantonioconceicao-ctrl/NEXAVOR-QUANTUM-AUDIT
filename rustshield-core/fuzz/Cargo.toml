[package]
name = "rustshield-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }
rustshield-domain = { path = "../crates/domain" }
rustshield-infrastructure = { path = "../crates/infrastructure" }
rustshield-application = { path = "../crates/application" }

[[bin]]
name = "ast_parser"
path = "fuzz_targets/ast_parser.rs"
test = false
doc = false

[[bin]]
name = "refactor_engine"
path = "fuzz_targets/refactor_engine.rs"
test = false
doc = false

[[bin]]
name = "fuzz_structured_parser"
path = "fuzz_targets/fuzz_structured_parser.rs"
test = false
doc = false
