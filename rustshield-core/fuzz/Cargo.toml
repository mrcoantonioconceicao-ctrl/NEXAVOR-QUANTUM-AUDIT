[package]
name = "rustshield-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rustshield-domain = { path = "../crates/domain" }
rustshield-infrastructure = { path = "../crates/infrastructure" }

[[bin]]
name = "ast_parser"
path = "fuzz_targets/ast_parser.rs"
test = false
doc = false
